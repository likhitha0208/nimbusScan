<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NimbusScan (demo)</title>
<style>
:root{
  --bg:#080e1c; --bg2:#0c1426; --surface:rgba(24,36,60,.72); --surface2:rgba(255,255,255,.035);
  --border:rgba(148,178,220,.16); --border2:rgba(148,178,220,.28);
  --text:#e8eefa; --muted:#93a4c0; --side:rgba(7,12,24,.82); --code:#060b17; --track:rgba(148,178,220,.12);
  --primary:#4aa8ff; --primary2:#7c6cff; --critical:#ff5c63; --high:#ffa24a; --medium:#f0cd6e; --success:#34d399;
  --low:#56c8e6; --review:#a78bfa; --info:#8a9bb5;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --glow1:rgba(74,168,255,.16); --glow2:rgba(124,108,255,.14);
}
:root[data-theme="light"]{
  --bg:#eef3fb; --bg2:#e6edf8; --surface:rgba(255,255,255,.88); --surface2:rgba(15,30,60,.035);
  --border:rgba(20,40,80,.12); --border2:rgba(20,40,80,.24);
  --text:#0f1b2e; --muted:#586a85; --side:rgba(255,255,255,.9); --code:#f2f6fc; --track:rgba(20,40,80,.1);
  --primary:#1c6fe0; --primary2:#6a4fe0; --critical:#d63a43; --high:#cf6d0a; --medium:#9a7400; --success:#0e8a5f;
  --low:#0b86a6; --review:#7050e0; --info:#5d6f89;
  --shadow:0 8px 24px rgba(30,50,90,.12);
  --glow1:rgba(28,111,224,.12); --glow2:rgba(106,79,224,.1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh;
  background-image:radial-gradient(900px 500px at 85% -10%,var(--glow1),transparent 60%),radial-gradient(700px 480px at -5% 105%,var(--glow2),transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--primary)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* sidebar */
aside{width:236px;background:var(--side);backdrop-filter:blur(14px);border-right:1px solid var(--border);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:20px 14px;z-index:5}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 24px;font-weight:700;font-size:17px;letter-spacing:.01em}
.brand .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 6px 18px rgba(74,120,255,.4)}
.brand .logo svg{width:22px;height:22px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em}
.navlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:0 12px 8px;opacity:.8}
nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:3px;transition:background .18s,color .18s,transform .18s}
nav a:hover{background:var(--surface2);color:var(--text);transform:translateX(2px)}
nav a.on{background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 22%,transparent),transparent);color:var(--text)}
nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--primary),var(--primary2));box-shadow:0 0 10px var(--primary)}
nav a.on svg{color:var(--primary)}
.pill{margin-left:auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--critical) 18%,transparent);color:var(--critical)}
.pill:empty{display:none}
.sidefoot{margin-top:auto;padding:12px;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:12px;background:var(--surface2)}
.sidefoot:empty{display:none}
.sidefoot b{display:block;color:var(--text);font-size:12.5px}

/* main */
main{margin-left:236px;flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 32px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 78%,transparent);position:sticky;top:0;z-index:4;backdrop-filter:blur(12px)}
.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.stamp{color:var(--muted);font-size:12.5px;text-align:right}
.stamp b{color:var(--text);font-weight:600}
.btn{text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 13px;font-weight:500;transition:border-color .15s,transform .15s,box-shadow .15s}
.btn:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 22%,transparent)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:transparent;color:#fff;font-weight:600}
.btn.sm{padding:4px 11px;font-size:12.5px}
.btn.icon{padding:7px 9px}
#view{padding:26px 32px 64px;max-width:1360px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.card h3{margin:0 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.grid{display:grid;gap:16px}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(128px,1fr));margin-bottom:16px}
.g-2{grid-template-columns:1fr 1fr;margin-bottom:16px}
.g-3{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.stat{position:relative;overflow:hidden;cursor:default;transition:transform .18s,border-color .18s,box-shadow .18s}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c,var(--primary));opacity:.9}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(var(--c,var(--primary)),transparent 70%);opacity:.13}
.stat.link{cursor:pointer}
.stat.link:hover{transform:translateY(-3px);border-color:var(--c,var(--primary));box-shadow:0 14px 30px color-mix(in srgb,var(--c,var(--primary)) 22%,transparent)}
.stat .ic{position:absolute;right:14px;top:14px;color:var(--c,var(--primary));opacity:.85}
.stat .n{font-size:32px;font-weight:800;line-height:1.15;margin-top:4px;color:var(--c,var(--text));font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{padding-right:26px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.badge{--c:var(--info);display:inline-block;padding:1px 10px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid color-mix(in srgb,var(--c) 42%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.b-CRITICAL,.b-bad{--c:var(--critical)}.b-HIGH,.b-warn{--c:var(--high)}.b-MEDIUM{--c:var(--medium)}.b-LOW{--c:var(--low)}
.b-REVIEW{--c:var(--review)}.b-INFORMATIONAL,.b-NONE,.b-off{--c:var(--info)}.b-ok{--c:var(--success)}
details summary{cursor:pointer;color:var(--primary);font-size:12px;margin-top:8px}
.banner{display:flex;gap:12px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--high) 45%,transparent);background:color-mix(in srgb,var(--high) 9%,transparent);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.banner svg{color:var(--high);margin-top:2px}
.banner ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}
.banner.err{border-color:color-mix(in srgb,var(--critical) 50%,transparent);background:color-mix(in srgb,var(--critical) 9%,transparent)}.banner.err svg{color:var(--critical)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer;transition:background .15s}
tr.click:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
tr.sev td:first-child{box-shadow:inset 3px 0 0 var(--sev,transparent)}
.tw{overflow-x:auto}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
input,select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font:inherit}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px}
input[type=search]{flex:1;min-width:220px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
pre{background:var(--code);border:1px solid var(--border);border-radius:10px;padding:12px;overflow:auto;max-height:420px;font-size:12px;margin:8px 0 0;color:var(--text)}
.legend{display:grid;gap:4px;font-size:13px;flex:1;min-width:150px}
.legend div{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
.legend div:hover{background:var(--surface2)}
.legend i{width:10px;height:10px;border-radius:3px;box-shadow:0 0 8px currentColor}.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.donutwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.dnum{fill:var(--text);font-size:26px;font-weight:800}.dlbl{fill:var(--muted);font-size:9px;letter-spacing:.14em}
.dseg{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.svc-card{transition:transform .18s,border-color .18s}
.svc-card:hover{transform:translateY(-2px);border-color:var(--border2)}
.svc-card .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.svc-card .head svg{color:var(--primary)}.svc-card .head b{font-size:15px}
.svc-card .warn{font-size:12.5px;color:var(--high);margin-top:10px}
.pager{text-align:center;padding:12px}

/* hero */
.hero{--c:var(--primary);display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;padding:26px 32px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:-60px;top:-80px;width:360px;height:360px;border-radius:50%;background:radial-gradient(var(--c),transparent 68%);opacity:.14;pointer-events:none}
.gauge{position:relative;width:176px;height:176px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .trk{stroke:var(--track)}
.gauge .fg{stroke:var(--c);filter:drop-shadow(0 0 7px var(--c));transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.gv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gv b{font-size:46px;font-weight:800;line-height:1;color:var(--c);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gv small{color:var(--muted);font-size:12px;margin-top:4px}
.hero .eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.hero h2{font-size:28px;margin:4px 0 6px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:620px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}.chip svg{width:14px;height:14px}

/* stacked bars */
.bar{display:grid;grid-template-columns:140px 1fr 34px;gap:12px;align-items:center;margin:4px 0;font-size:13px;padding:5px 6px;border-radius:8px;cursor:pointer;transition:background .15s}
.bar:hover{background:var(--surface2)}
.bar .t{height:10px;border-radius:99px;background:var(--track);overflow:hidden;display:flex;gap:2px}
.bar .t i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}

/* service health tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{--c:var(--info);position:relative;padding:14px 14px 12px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.tile:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 12px 26px color-mix(in srgb,var(--c) 20%,transparent)}
.tile .top2{display:flex;align-items:center;gap:8px;font-weight:600}
.tile .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c);flex:none}
.tile .meta{margin-top:10px;display:flex;justify-content:space-between;align-items:flex-end;color:var(--muted);font-size:12px}
.tile .meta b{display:block;font-size:20px;color:var(--text);line-height:1.1;font-variant-numeric:tabular-nums}
.tile .st{font-size:11.5px;color:var(--c);font-weight:600;margin-top:2px}
.tile.ok{--c:var(--success)}.tile.warn{--c:var(--high)}.tile.bad{--c:var(--critical)}.tile.off{--c:var(--info)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(3,7,15,.62);backdrop-filter:blur(3px);z-index:9;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg2);border-left:1px solid var(--border2);z-index:10;overflow-y:auto;padding:24px 26px;box-shadow:-20px 0 50px rgba(0,0,0,.4);animation:slide .28s cubic-bezier(.2,.8,.2,1)}
.drawer h2{margin:12px 0 4px;font-size:19px}
.drawer section{margin-top:20px}
.drawer h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.skel{height:92px;border-radius:16px;background:linear-gradient(90deg,var(--surface2),var(--track),var(--surface2));background-size:200% 100%;animation:sh 1.2s infinite}

/* motion */
@keyframes sh{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#view>*,#view .grid>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#view>*:nth-child(2),#view .grid>*:nth-child(2){animation-delay:.05s}
#view>*:nth-child(3),#view .grid>*:nth-child(3){animation-delay:.1s}
#view>*:nth-child(4),#view .grid>*:nth-child(4){animation-delay:.15s}
#view>*:nth-child(5),#view .grid>*:nth-child(5){animation-delay:.2s}
#view .grid>*:nth-child(n+6){animation-delay:.25s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media(max-width:1000px){.g-2{grid-template-columns:1fr}.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.chips{justify-content:center}}
@media(max-width:860px){
  aside{width:64px;padding:14px 8px}.brand .bt,nav a span,.navlabel,.sidefoot,.pill{display:none}.brand{padding:2px 4px 18px}nav a{justify-content:center;padding:11px}nav a.on::before{left:-8px}
  main{margin-left:64px}#view{padding:16px}.top{padding:12px 16px}.kv{grid-template-columns:1fr}.bar{grid-template-columns:100px 1fr 30px}
}
</style>
</head>
<body>
<aside>
  <div class="brand"><span class="logo" data-i="logo"></span><div class="bt">NimbusScan<small>AWS Cloud Security</small></div></div>
  <div class="navlabel">Navigate</div>
  <nav id="nav"></nav>
  <div class="sidefoot" id="sidefoot"></div>
</aside>
<main>
  <div class="top">
    <h1 id="title">Dashboard</h1>
    <span class="badge b-warn">DEMO · SAMPLE DATA</span><div class="stamp" id="stamp"></div>
    <button class="btn icon" id="theme" aria-label="Toggle light/dark theme" title="Toggle theme"></button>
    <button class="btn" id="refresh"><span data-i="refresh"></span>Refresh</button>
  </div>
  <div id="view"><div class="grid g-stats"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
</main>
<div id="overlay"></div>

<script>
"use strict";
/* ============ config ============ */
const REPORT_DIR = "reports/";
const ANALYSIS_FILE = "security_analysis_report.json";
const STALE_HOURS = 1e9; // demo: sample data never goes stale
const SEV = ["CRITICAL","HIGH","MEDIUM","LOW","REVIEW","INFORMATIONAL"];
const SEV_COLOR = {CRITICAL:"var(--critical)",HIGH:"var(--high)",MEDIUM:"var(--medium)",LOW:"var(--low)",REVIEW:"var(--review)",INFORMATIONAL:"var(--info)"};
const SEV_HEX = {CRITICAL:"#EF5350",HIGH:"#FF9F43",MEDIUM:"#EBCB70",LOW:"#5BC0DE",REVIEW:"#A78BFA",INFORMATIONAL:"#8394AA"};
const SEV_WEIGHT ={CRITICAL:15,HIGH:8,MEDIUM:3,LOW:1,REVIEW:0.25,INFORMATIONAL:0};
const category = s => ["CRITICAL","HIGH","MEDIUM","LOW"].includes(s) ? "Confirmed issue" : s === "REVIEW" ? "Needs review" : "Informational";
const CATEGORIES = ["Confirmed issue","Needs review","Informational"];

const ICON = {
  logo:"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z M9 12l2 2 4-4",
  dashboard:"M3 3h8v8H3z M13 3h8v5h-8z M13 10h8v11h-8z M3 13h8v8H3z",
  scans:"M12 3a9 9 0 1 0 9 9 M12 7a5 5 0 1 0 5 5 M12 12l6-6",
  findings:"M12 3l9 16H3z M12 10v4 M12 17h.01",
  services:"M7 18a4 4 0 0 1-.5-7.97A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z",
  reports:"M7 3h8l4 4v14H7z M15 3v4h4 M10 13h6 M10 17h6",
  settings:"M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2",
  refresh:"M21 12a9 9 0 1 1-3-6.7 M21 4v5h-5",
  warn:"M12 3l9 16H3z M12 10v4 M12 17h.01",
  download:"M12 4v11 M7 11l5 5 5-5 M5 20h14",
  close:"M6 6l12 12 M18 6L6 18",
  check:"M5 12l5 5 9-10",
  layers:"M12 3l9 5-9 5-9-5z M3 13l9 5 9-5",
  flame:"M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z",
  eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",
  pin:"M12 21s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12z M12 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4z",
  clock:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2",
  sun:"M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 2v2 M12 20v2 M2 12h2 M20 12h2 M5 5l1.5 1.5 M17.5 17.5L19 19 M19 5l-1.5 1.5 M6.5 17.5L5 19",
  moon:"M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"
};
const icon = n => `<svg class="i" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`;

/* AWS service definitions: file = report written by the scanner script */
const SERVICES = [
  {key:"SCAN",       name:"VPC & Security Groups", file:"scan_report.json",       script:"vpc_scanner.py"},
  {key:"NACL",       name:"Network ACLs",          file:"nacl_report.json",       script:"nacl_scanner.py"},
  {key:"IAM",        name:"IAM",                   file:"iam_report.json",        script:"iam_scanner.py"},
  {key:"S3",         name:"S3",                    file:"s3_report.json",         script:"S3_scanner.py"},
  {key:"CLOUDTRAIL", name:"CloudTrail",            file:"cloudtrail_report.json", script:"cloudtrail_analyzer.py"},
  {key:"GUARDDUTY",  name:"GuardDuty",             file:"guardduty_report.json",  script:"guardduty_scanner.py"},
  {key:"CONFIG",     name:"AWS Config",            file:"config_report.json",     script:"config_scanner.py"}
];
const svcName = k => (SERVICES.find(s => s.key === k) || {name:k}).name;

/* ============ tiny DOM helper (text only, no innerHTML for data) ============ */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;        // static strings only
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}

/* ============ data loading ============ */
let DB = null;                 // {reports:{file:{state,data,modified,bytes,raw}}, findings:[], ...}
const FILTER = {q:"", sev:"", svc:"", cat:""};

async function loadFile(file){
  try{
    const r = await fetch(REPORT_DIR + file, {cache:"no-store"});
    if (r.status === 404) return {state:"missing"};
    if (!r.ok) return {state:"error", error:`HTTP ${r.status}`};
    const raw = await r.text();
    try{
      return {state:"ok", data:JSON.parse(raw), raw, bytes:raw.length, modified:r.headers.get("Last-Modified")};
    }catch(e){ return {state:"error", error:"Invalid JSON: " + e.message}; }
  }catch(e){ return {state:"error", error:"Could not reach server (" + e.message + ")"}; }
}

async function loadAll(){
  const files = [...SERVICES.map(s => s.file), ANALYSIS_FILE];
  const results = await Promise.all(files.map(loadFile));
  const reports = Object.fromEntries(files.map((f,i) => [f, results[i]]));
  DB = build(reports);
}

function scanTime(rep){
  if (!rep || rep.state !== "ok") return null;
  const t = rep.data.scan_time || rep.data.scan_time_utc || rep.modified;
  const d = t ? new Date(t) : null;
  return d && !isNaN(d) ? d : null;
}

/* per-service metrics computed from each report (never hardcoded) */
function metrics(key, d){
  const n = x => (typeof x === "number" ? x : 0);
  switch(key){
    case "SCAN": return {resources:n(d.vpc_count)+n(d.security_group_count), unit:"VPCs + security groups",
      rows:[["VPCs",n(d.vpc_count)],["Security groups",n(d.security_group_count)],["High-risk findings",n(d.high_risk_findings)]]};
    case "NACL": return {resources:n(d.network_acl_count), unit:"network ACLs",
      rows:[["Network ACLs",n(d.network_acl_count)],["Rules checked",n(d.rules_checked)]]};
    case "IAM": return {resources:n(d.users_scanned)+n(d.roles_scanned), unit:"users + roles",
      rows:[["Users",n(d.users_scanned)],["Roles",n(d.roles_scanned)]]};
    case "S3": return {resources:n(d.buckets_scanned), unit:"buckets", rows:[["Buckets",n(d.buckets_scanned)]]};
    case "CLOUDTRAIL": return {resources:n(d.events_scanned), unit:"events", notResource:true,
      rows:[["Events analysed",n(d.events_scanned)],["Period",d.period || "—"]]};
    case "GUARDDUTY": return {resources:n(d.findings_scanned), unit:"GuardDuty findings", notResource:true,
      rows:[["GuardDuty enabled",d.guardduty_enabled ? "Yes" : "No"],["Findings scanned",n(d.findings_scanned)]],
      warn: d.guardduty_enabled ? null : "GuardDuty is not enabled in this region, so no threat-detection data was scanned."};
    case "CONFIG": return {resources:n(d.rules_scanned), unit:"Config rules",
      rows:[["Recorders",(d.recorders||[]).length],["Rules scanned",n(d.rules_scanned)],
            ["Compliant",n((d.compliance_summary||{}).COMPLIANT)],["Non-compliant",n((d.compliance_summary||{}).NON_COMPLIANT)]],
      warn: (d.recorders||[]).length ? null : "No AWS Config recorder found, so configuration compliance was not evaluated."};
  }
  return {resources:0, unit:"", rows:[]};
}

function build(reports){
  const analysis = reports[ANALYSIS_FILE];
  const findings = analysis.state === "ok" ? (analysis.data.findings || []) : [];
  const now = Date.now();
  const scanners = SERVICES.map(s => {
    const rep = reports[s.file];
    const o = {...s, rep, state:rep.state, time:scanTime(rep), m:null, warn:null, stale:false};
    if (rep.state === "ok"){
      o.m = metrics(s.key, rep.data);
      o.warn = o.m.warn;
      o.stale = o.time ? (now - o.time) > STALE_HOURS*3600e3 : true;
      o.ownFindings = (rep.data.findings || []).length;
    }
    o.findings = findings.filter(f => f.service === s.key);
    if (analysis.state !== "ok" && rep.state === "ok") o.findings = [];
    // status label
    if (rep.state === "missing") o.status = ["Not configured","off"];
    else if (rep.state === "error") o.status = ["Scan failed","bad"];
    else if (o.warn) o.status = ["Incomplete","warn"];
    else if (o.stale) o.status = ["Stale","warn"];
    else o.status = ["Completed","ok"];
    return o;
  });
  const counts = Object.fromEntries(SEV.map(s => [s, 0]));
  findings.forEach(f => { if (f.severity in counts) counts[f.severity]++; });
  const times = scanners.map(s => s.time).filter(Boolean);
  const warnings = [];
  const missing = scanners.filter(s => s.state === "missing");
  const failed = scanners.filter(s => s.state === "error");
  if (analysis.state === "missing") warnings.push(["bad", "No analysis report available (reports/" + ANALYSIS_FILE + "). Run run_all.py to generate findings."]);
  if (analysis.state === "error") warnings.push(["bad", "Analysis report could not be read: " + analysis.error]);
  if (failed.length) warnings.push(["bad", "Failed to read: " + failed.map(s => s.name + " (" + s.rep.error + ")").join("; ")]);
  if (missing.length) warnings.push(["warn", "Scan incomplete — no report for: " + missing.map(s => s.name).join(", ") + "."]);
  scanners.filter(s => s.warn).forEach(s => warnings.push(["warn", s.name + ": " + s.warn]));
  const stale = scanners.filter(s => s.stale && s.state === "ok");
  if (stale.length) warnings.push(["warn", `Reports older than ${STALE_HOURS} hours: ${stale.map(s => s.name).join(", ")}. Last scan ${ago(new Date(Math.min(...stale.map(s => s.time || now))))}. Re-run run_all.py for current data.`]);
  if (analysis.state === "ok" && analysis.data.analysis_time && (now - new Date(analysis.data.analysis_time)) > STALE_HOURS*3600e3)
    warnings.push(["warn", "The analysis report is older than " + STALE_HOURS + " hours."]);

  // "completed" = the script ran and wrote a report; "evaluated" = the AWS service was actually assessed
  const evaluated = scanners.filter(s => s.state === "ok" && !s.warn);
  const notEvaluated = scanners.filter(s => !(s.state === "ok" && !s.warn));
  const completed = scanners.filter(s => s.state === "ok");
  const complete = analysis.state === "ok" && !missing.length && !failed.length && !notEvaluated.length;
  let score = null;
  if (analysis.state === "ok"){
    const penalty = SEV.reduce((a,s) => a + counts[s]*SEV_WEIGHT[s], 0);
    score = Math.max(0, Math.round(100 - penalty));
  }
  return {reports, analysis, findings, counts, scanners, warnings, complete, score, evaluated, notEvaluated, completed,
    confirmed: counts.CRITICAL + counts.HIGH + counts.MEDIUM + counts.LOW,
    lastScan: times.length ? new Date(Math.max(...times)) : null,
    // events / GuardDuty findings are activity, not infrastructure resources
    resources: scanners.reduce((a,s) => a + (s.m && !s.m.notResource ? s.m.resources : 0), 0),
    region: (scanners.map(s => s.rep.state === "ok" && s.rep.data.region).find(Boolean)) || null};
}

/* ============ utils ============ */
function ago(d){
  const s = Math.max(0, (Date.now() - d) / 1000);
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s/60) + " min ago";
  if (s < 129600) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " days ago";
}
const fmtDate = d => d ? d.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}) : "—";
const val = v => v == null ? "—" : typeof v === "object" ? JSON.stringify(v) : String(v);
function download(name, text, type){
  const a = h("a", {href:URL.createObjectURL(new Blob([text], {type})), download:name});
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function csvCell(v){
  let s = val(v === undefined ? "" : v); if (v == null) s = "";
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;         // block spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function findingsToCsv(list){
  const cols = ["severity","category","service","resource","identity","description","recommendation","validation_required","evidence"];
  const rows = list.map(f => [f.severity, category(f.severity), svcName(f.service), f.resource, f.identity, f.description, f.recommendation, f.validation_required, f.source_finding]);
  return [cols, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
}
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el, n){
  el.textContent = n.toLocaleString();
  if (REDUCED || !Number.isFinite(n) || n < 2) return;
  const t0 = performance.now(), D = 900;
  (function f(t){ const p = Math.min(1, (t - t0) / D); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString(); if (p < 1) requestAnimationFrame(f); })(t0);
}
const svgNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs){ const e = document.createElementNS(svgNS, tag); for (const [k,v] of Object.entries(attrs || {})) e.setAttribute(k, v); return e; }
function setTheme(t){

  try{ localStorage.setItem("ns-theme", t); }catch(e){}
  const b = document.getElementById("theme"); if (b) b.replaceChildren(h("span", {html:icon(t === "light" ? "moon" : "sun")}));

function applyFilter(list){

  return list.filter(f =>

}

function goFindings(patch){ Object.assign(FILTER, {q:"",sev:"",svc:"",cat:""}, patch); if (location.hash === "#/findings") route(); else location.hash = "#/findings"; }

function findingsTable(list, {limit = 100} = {}){

function donut(counts){
  const total = SEV.reduce((a,s) => a + counts[s], 0), R = 52, C = 2*Math.PI*R;
  const svg = svgEl("svg", {viewBox:"0 0 140 140", width:"160", height:"160", role:"img", "aria-label":"Severity distribution"});
  svg.append(svgEl("circle", {cx:70, cy:70, r:R, fill:"none", stroke:"currentColor", "stroke-opacity":".12", "stroke-width":14}));
  let off = 0; const segs = [];
  const gap = SEV.filter(s => counts[s]).length > 1 ? 2 : 0;
  if (total) SEV.forEach(s => { if (!counts[s]) return; const len = counts[s]/total*C;
    const c = svgEl("circle", {cx:70, cy:70, r:R, fill:"none", class:"dseg", stroke:SEV_HEX[s], "stroke-width":14, "stroke-dasharray":`0 ${C}`, "stroke-dashoffset":-off, transform:"rotate(-90 70 70)"});
    svg.append(c); segs.push([c, len]); off += len; });
  requestAnimationFrame(() => requestAnimationFrame(() => segs.forEach(([c, len]) => c.setAttribute("stroke-dasharray", `${Math.max(0, len - gap)} ${C - len + gap}`))));
  const t = svgEl("text", {x:70, y:72, "text-anchor":"middle", class:"dnum"}); t.textContent = total;
  const t2 = svgEl("text", {x:70, y:90, "text-anchor":"middle", class:"dlbl"}); t2.textContent = "FINDINGS";
  svg.append(t, t2);
  const legend = h("div", {class:"legend"}, SEV.map(s => h("div", {onclick:() => goFindings({sev:s})},
    h("i", {style:"background:" + SEV_COLOR[s] + ";color:" + SEV_COLOR[s]}), s[0] + s.slice(1).toLowerCase(), h("b", {text:counts[s]}))));
  return h("div", {class:"donutwrap"}, svg, legend);
}

function gauge(score, show){
  const R = 52, C = 2*Math.PI*R;
  const svg = svgEl("svg", {viewBox:"0 0 120 120", "aria-hidden":"true"});
  svg.append(svgEl("circle", {cx:60, cy:60, r:R, fill:"none", class:"trk", "stroke-width":10}));
  const fg = svgEl("circle", {cx:60, cy:60, r:R, fill:"none", class:"fg", "stroke-width":10, "stroke-linecap":"round", "stroke-dasharray":C, "stroke-dashoffset":C});
  svg.append(fg);
  if (show) requestAnimationFrame(() => requestAnimationFrame(() => fg.setAttribute("stroke-dashoffset", C * (1 - score/100))));
  const num = h("b", {text:"N/A"});
  if (show) countUp(num, score);
  return h("div", {class:"gauge", role:"img", "aria-label":show ? "Security score " + score + " out of 100" : "Security score not available"},
    svg, h("div", {class:"gv"}, num, h("small", {text: show ? "out of 100" : "score withheld"})));
}

  findings(){
    const holder = h("div");
    const count = h("span", {class:"muted"});
    const q = h("input", {type:"search", placeholder:"Search findings, resources, identities…", value:FILTER.q, oninput:e => { FILTER.q = e.target.value; draw(); }});
    const sel = (key, label, opts) => h("select", {"aria-label":label, onchange:e => { FILTER[key] = e.target.value; draw(); }},
      h("option", {value:"", text:label}), opts.map(o => h("option", {value:o[0], text:o[1], selected:FILTER[key] === o[0]})));
    function draw(){
      const list = sortSev(applyFilter(DB.findings));
      count.textContent = `${list.length} of ${DB.findings.length} findings`;
      holder.replaceChildren(findingsTable(list));
      draw.list = list;
    }
    const page = h("div", {}, banners(),
      h("div", {class:"toolbar"}, q,
        sel("sev","All severities", SEV.map(s => [s,s])), sel("svc","All AWS services", SERVICES.map(s => [s.key,s.name])), sel("cat","All risk categories", CATEGORIES.map(c => [c,c])),
        h("button", {class:"btn", onclick:() => { Object.assign(FILTER,{q:"",sev:"",svc:"",cat:""}); route(); }, text:"Clear"}),
        h("button", {class:"btn", onclick:() => download(`findings-${stampName()}.csv`, findingsToCsv(draw.list), "text/csv"), html:icon("download") + "CSV"}),
        h("button", {class:"btn", onclick:() => download(`findings-${stampName()}.json`, JSON.stringify(draw.list, null, 2), "application/json"), html:icon("download") + "JSON"})),
      h("div", {class:"row", style:"margin-bottom:8px"}, count),
      h("div", {class:"card"}, holder));
    draw();
    return page;
  },

  services(){
    return h("div", {}, banners(), h("div", {class:"grid g-3"}, DB.scanners.map(s => {
      const per = Object.fromEntries(SEV.map(v => [v, s.findings.filter(f => f.severity === v).length]));
      return h("div", {class:"card svc-card"},
        h("div", {class:"head"}, h("span", {html:icon("services")}), h("b", {text:s.name}), h("span", {class:"sp"}), badge(s.status[0], "b-" + s.status[1])),
        s.state === "ok" ? h("div", {},
          h("dl", {class:"kv", style:"grid-template-columns:140px 1fr"}, s.m.rows.flatMap(([k,v]) => [h("dt",{text:k}), h("dd",{text:v})]).concat([h("dt",{text:"Last scan"}), h("dd",{text:fmtDate(s.time)})])),
          h("div", {class:"row", style:"margin-top:12px;flex-wrap:wrap"},
            SEV.filter(v => per[v]).map(v => h("span", {style:"cursor:pointer", onclick:() => goFindings({svc:s.key, sev:v})}, badge(per[v] + " " + v.toLowerCase(), "b-" + v))),
            s.findings.length ? null : s.warn ? badge("Not evaluated", "b-warn") : badge("No findings", "b-ok")),
          s.warn ? h("div", {class:"warn", text:s.warn}) : null,
          s.findings.length ? h("div", {style:"margin-top:12px"}, h("button", {class:"btn sm", onclick:() => goFindings({svc:s.key}), text:"View findings"})) : null)
        : empty(s.state === "missing" ? "Not configured" : "Scan failed", s.state === "missing" ? "No report available. Run " + s.script + "." : s.rep.error));
    })));
  },

  reports(){
    const files = [...SERVICES.map(s => [s.name, s.file]), ["Security analysis", ANALYSIS_FILE]];
    let sel = files.find(f => DB.reports[f[1]].state === "ok");
    const prev = h("div");
    const showPrev = file => {
      const r = DB.reports[file];
      prev.replaceChildren(r && r.state === "ok" ? h("div", {}, h("div", {class:"row"}, h("b", {class:"mono", text:file}), h("span",{class:"sp"}),
          h("button", {class:"btn sm", html:icon("download") + "Download", onclick:() => download(file, r.raw, "application/json")})),
          h("pre", {text:JSON.stringify(r.data, null, 2).slice(0, 60000) + (r.raw.length > 60000 ? "\n… preview truncated, download for full file" : "")}))
        : empty("No report available", "Select a report that has been generated."));
    };
    showPrev(sel ? sel[1] : null);
    const summary = () => {
      const c = DB.counts;
      return ["# AWS Cloud Security Scan Summary", "", `Generated: ${new Date().toLocaleString()}`, `Last scan: ${fmtDate(DB.lastScan)}`, `Region: ${DB.region || "unknown"}`,
        `Security score: ${DB.score != null && DB.complete ? DB.score : "N/A (" + DB.notEvaluated.length + " services not evaluated)"}`,
        `Scanners completed: ${DB.completed.length}/${SERVICES.length}; services evaluated: ${DB.evaluated.length}/${SERVICES.length}`,
        `Findings: ${DB.findings.length} total, ${DB.confirmed} confirmed, ${DB.counts.REVIEW} need review`, "",
        "## Findings", ...SEV.map(s => `- ${s}: ${c[s]}`), `- Total: ${DB.findings.length}`, "",
        "## Scanners", ...DB.scanners.map(s => `- ${s.name}: ${s.status[0]}${s.time ? " (" + fmtDate(s.time) + ")" : ""}, ${s.state === "ok" ? s.findings.length : "n/a"} findings`),
        "", "## Warnings", ...(DB.warnings.length ? DB.warnings.map(w => "- " + w[1]) : ["- None"])].join("\n");
    };
    return h("div", {}, banners(),
      h("div", {class:"card", style:"margin-bottom:14px"}, h("h3", {text:"Export"}), h("div", {class:"toolbar", style:"margin:0"},
        h("button", {class:"btn primary", html:icon("download") + "Summary report (.md)", onclick:() => download(`security-summary-${stampName()}.md`, summary(), "text/markdown")}),
        h("button", {class:"btn", html:icon("download") + "All findings (CSV)", onclick:() => download(`findings-${stampName()}.csv`, findingsToCsv(sortSev(DB.findings)), "text/csv")}),
        h("button", {class:"btn", html:icon("download") + "All findings (JSON)", onclick:() => download(`findings-${stampName()}.json`, JSON.stringify(sortSev(DB.findings), null, 2), "application/json")}))),
      h("div", {class:"card", style:"margin-bottom:14px"}, h("h3", {text:"Generated reports"}), h("div", {class:"tw"}, h("table", {},
        h("thead", {}, h("tr", {}, ["Report","File","Last scan","Last modified","Size","",""].map(t => h("th",{text:t})))),
        h("tbody", {}, files.map(([name,file]) => { const r = DB.reports[file];
          const t = file === ANALYSIS_FILE ? (r.state === "ok" && r.data.analysis_time ? new Date(r.data.analysis_time) : null) : scanTime(r);
          return h("tr", {},
            h("td", {text:name}), h("td", {class:"mono muted", text:file}),
            h("td", {text: r.state === "ok" ? fmtDate(t) : r.state === "missing" ? "No report available" : "Failed: " + r.error}),
            h("td", {class:"muted", text: r.modified ? fmtDate(new Date(r.modified)) : "—"}),
            h("td", {class:"muted", text: r.bytes ? (r.bytes/1024).toFixed(1) + " KB" : "—"}),
            h("td", {}, r.state === "ok" ? h("button", {class:"btn sm", text:"Preview", onclick:() => showPrev(file)}) : ""),
            h("td", {}, r.state === "ok" ? h("button", {class:"btn sm", html:icon("download"), "aria-label":"Download " + file, onclick:() => download(file, r.raw, "application/json")}) : ""));
        }))))),
      h("div", {class:"card"}, h("h3", {text:"JSON preview"}), prev));
  },

  settings(){
    const a = DB.analysis.state === "ok" ? DB.analysis.data : {};
    const kv = rows => h("dl", {class:"kv"}, rows.flatMap(([k,v]) => [h("dt",{text:k}), h("dd",{text:v})]));
    return h("div", {}, banners(), h("div", {class:"grid g-2"},
      h("div", {class:"card"}, h("h3", {text:"Scan configuration"}), kv([
        ["AWS region", DB.region || "Unknown (no report loaded)"], ["Last scan", fmtDate(DB.lastScan)],
        ["Stale after", STALE_HOURS + " hours"], ["Report directory", REPORT_DIR],
        ["Scope", SERVICES.map(s => s.name).join(", ")], ["Access", "Read-only (describe/list/get API calls)"]])),
      h("div", {class:"card"}, h("h3", {text:"About"}), kv([
        ["Project", a.project || "AWS Cloud Network Security Scanner"], ["Version", "1.0"],
        ["Stack", "Python / boto3 scanners, static HTML dashboard"],
        ["Run scanners", "python run_all.py"], ["Open dashboard", "python dashboard.py"],
        ["Security score", "100 − Σ(findings × weight); weights: Critical 15, High 8, Medium 3, Low 1, Review 0.25, Informational 0. Shown as N/A unless every service was evaluated."]]))),
      h("div", {class:"card"}, h("h3", {text:"Limitations"}),
        a.limitations && a.limitations.length ? h("ul", {}, a.limitations.map(l => h("li", {text:l}))) : empty("No limitations listed", "Analysis report not available."),
        h("ul", {class:"muted"}, h("li", {text:"REVIEW findings need manual validation and are not confirmed vulnerabilities."}),
          h("li", {text:"The dashboard only reflects the last scan; it does not poll AWS live."}),
          h("li", {text:"Services that are not enabled (e.g. GuardDuty, AWS Config) produce no findings, which is not the same as a clean result."}))));
  }
};

const TITLES = {dashboard:"Dashboard", scans:"Scan Results", findings:"Findings", services:"AWS Services", reports:"Reports", settings:"Settings / About"};

/* ============ router ============ */
function route(){
  closeOverlay();
  const page = (location.hash.replace(/^#\//, "") || "dashboard");
  const key = PAGES[page] ? page : "dashboard";
  document.getElementById("title").textContent = TITLES[key];
  document.title = TITLES[key] + " · NimbusScan";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.p === key));
  document.getElementById("view").replaceChildren(DB ? PAGES[key]() : "");
  window.scrollTo(0, 0);
}
function updateStamp(){
  const s = document.getElementById("stamp");
  s.replaceChildren(DB && DB.lastScan ? h("span", {}, "Last scan: ", h("b", {text:fmtDate(DB.lastScan)}), " (" + ago(DB.lastScan) + ")") : "No scan data");
  document.getElementById("sidefoot").replaceChildren(...(DB && DB.region ? [h("b", {text:DB.region}), "AWS region"] : []));
  const nc = document.getElementById("navcount");
  if (nc) nc.textContent = DB && DB.counts && (DB.counts.CRITICAL + DB.counts.HIGH) ? String(DB.counts.CRITICAL + DB.counts.HIGH) : "";
}

async function init(){
  document.querySelectorAll("[data-i]").forEach(e => e.innerHTML = icon(e.dataset.i));
  document.getElementById("nav").replaceChildren(...Object.entries(TITLES).map(([k,t]) =>
    h("a", {href:"#/" + k, "data-p":k, title:t}, h("span", {html:icon(k)}), h("span", {text:t}), k === "findings" ? h("span", {class:"pill", id:"navcount", title:"Critical + High findings"}) : null)));
  document.getElementById("refresh").onclick = async () => { document.getElementById("view").replaceChildren(h("div",{class:"skel"})); await loadAll(); updateStamp(); route(); };
  document.getElementById("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
  window.addEventListener("hashchange", route);
  try{ await loadAll(); }
  catch(e){ document.getElementById("view").replaceChildren(h("div", {class:"banner err"}, h("span",{html:icon("warn")}), h("div", {text:"Could not load reports: " + e.message + ". Start the dashboard with python dashboard.py."}))); return; }
  updateStamp(); route();
}
let savedTheme = null; try{ savedTheme = localStorage.getItem("ns-theme"); }catch(e){}
setTheme(savedTheme === "light" ? "light" : "dark");
init();
</script>
</body>
</html>
